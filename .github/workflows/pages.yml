name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Publish only the site itself: no git data, workflows, docs or license file.
      - name: Stage site
        run: |
          mkdir _site
          rsync -a \
            --exclude '_site/' --exclude '.git/' --exclude '.github/' \
            --exclude '.gitattributes' --exclude '*.md' --exclude 'LICENSE' \
            ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
