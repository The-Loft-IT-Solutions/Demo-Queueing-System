<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queueing System - Kiosk Terminal</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/kiosk.css">
</head>
<body class="kiosk-page">
  <div class="kiosk-header">
    <h1>Welcome</h1>
    <p>Please select a service to get your ticket number</p>
  </div>

  <div class="service-buttons" id="kiosk-services">
    <!-- Populated by JS -->
  </div>

  <div class="kiosk-footer">
    <div class="clock" id="kiosk-clock">--:--:--</div>
    <div>Self-Service Kiosk &bull; Demo Mode</div>
  </div>

  <!-- Name Input Modal -->
  <div class="modal-overlay" id="name-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Enter Your Name</h3>
        <button class="modal-close" onclick="closeModal('name-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="kiosk-name-input" placeholder="Enter your full name" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-select" id="kiosk-priority-input">
            <option value="normal">Normal</option>
            <option value="priority">Priority (Senior / PWD)</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('name-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="submitKioskName()">Get Ticket</button>
      </div>
    </div>
  </div>

  <!-- Ticket Print Overlay -->
  <div class="ticket-overlay" id="ticket-overlay">
    <div class="ticket-print" id="ticket-print-content">
      <div class="ticket-print-header">
        <h2>Queueing System</h2>
        <div class="datetime" id="ticket-datetime">--</div>
      </div>
      <div class="ticket-print-number" id="ticket-number">--</div>
      <div class="ticket-print-service" id="ticket-service-name">--</div>
      <div class="ticket-print-counter" id="ticket-counter-info">--</div>
      <div class="ticket-print-info">
        <div class="ticket-print-info-row">
          <span class="label">Estimated Wait</span>
          <span class="value" id="ticket-wait-time">--</span>
        </div>
        <div class="ticket-print-info-row">
          <span class="label">People Ahead</span>
          <span class="value" id="ticket-ahead">--</span>
        </div>
        <div class="ticket-print-info-row">
          <span class="label">Date</span>
          <span class="value" id="ticket-date">--</span>
        </div>
      </div>
      <div class="ticket-print-barcode"></div>
      <div class="ticket-print-footer">
        Please wait for your number to be called.<br>
        Thank you for your patience.
      </div>
      <div style="margin-top:20px;">
        <button class="btn btn-primary" style="width:100%;" onclick="closeTicketOverlay()">Done</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/websocket.js"></script>
  <script src="../js/kiosk.js"></script>

  <div id="dcwPoweredBy" style="position:fixed;bottom:18px;right:18px;z-index:1000;background:rgba(15,23,42,0.85);color:#f1f5f9;font-size:11.5px;padding:7px 12px;border-radius:20px;letter-spacing:.2px;font-family:inherit;">Powered by <a href="https://theloftitsolutions.com" target="_blank" rel="noopener" style="color:#f1f5f9;">The Loft IT Solutions</a></div>
</body>
</html>
