<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueFlow - Settings</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">Q</div>
        <div class="logo-text">Queue<span>Flow</span></div>
      </div>
    </div>
    <nav class="nav-menu">
      <div class="nav-section">
        <div class="nav-section-title">Main</div>
        <a href="../../index.html" class="nav-item">
          <span class="icon">&#128202;</span>
          <span>Dashboard</span>
        </a>
        <a href="tickets.html" class="nav-item">
          <span class="icon">&#127915;</span>
          <span>Tickets</span>
          <span class="nav-badge" id="nav-total-tickets">0</span>
        </a>
        <a href="counters.html" class="nav-item">
          <span class="icon">&#128187;</span>
          <span>Counters</span>
          <span class="nav-badge" id="nav-active-counters">0</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Operations</div>
        <a href="kiosk.html" class="nav-item" target="_blank">
          <span class="icon">&#128241;</span>
          <span>Kiosk Terminal</span>
        </a>
        <a href="display.html" class="nav-item" target="_blank">
          <span class="icon">&#128250;</span>
          <span>Public Display</span>
        </a>
        <a href="live-feed.html" class="nav-item">
          <span class="icon">&#128225;</span>
          <span>Live Feed</span>
          <span class="nav-badge" id="nav-live-count">0</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Reports</div>
        <a href="reports.html" class="nav-item">
          <span class="icon">&#128200;</span>
          <span>Analytics</span>
        </a>
        <a href="settings.html" class="nav-item active">
          <span class="icon">&#9881;</span>
          <span>Settings</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name">Admin User</div>
          <div class="user-role">System Administrator</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="page-title">
        Settings
        <span class="subtitle">System configuration</span>
      </div>
    </header>

    <div class="content-area">
      <div class="card fade-in">
        <div class="card-header">
          <div class="card-title">General Settings</div>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Organization Name</label>
            <input type="text" class="form-input" value="QueueFlow Demo Bank" id="setting-org-name">
          </div>
          <div class="form-group">
            <label class="form-label">Working Hours</label>
            <div style="display:flex;gap:12px;">
              <input type="time" class="form-input" value="08:00" id="setting-open-time">
              <span style="align-self:center;color:var(--gray);">to</span>
              <input type="time" class="form-input" value="17:00" id="setting-close-time">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Max Queue Per Counter</label>
            <input type="number" class="form-input" value="50" id="setting-max-queue">
          </div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-header">
          <div class="card-title">Services Configuration</div>
        </div>
        <div class="card-body">
          <div id="services-config-list">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-header">
          <div class="card-title">Data Management</div>
        </div>
        <div class="card-body">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="resetDemoData()">
              <span>&#128260;</span> Reset Demo Data
            </button>
            <button class="btn btn-danger" onclick="clearAllTickets()">
              <span>&#128465;</span> Clear All Tickets
            </button>
            <button class="btn btn-warning" onclick="exportData()">
              <span>&#128229;</span> Export Data
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script src="../js/data.js"></script>
  <script src="../js/websocket.js"></script>
  <script src="../js/settings.js"></script>

  <div id="dcwPoweredBy" style="position:fixed;bottom:18px;right:18px;z-index:1000;background:rgba(15,23,42,0.85);color:#f1f5f9;font-size:11.5px;padding:7px 12px;border-radius:20px;letter-spacing:.2px;font-family:inherit;">Powered by <a href="https://theloftitsolutions.com" target="_blank" rel="noopener" style="color:#f1f5f9;">The Loft IT Solutions</a></div>
</body>
</html>
